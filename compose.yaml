services:
  skill-market:
    build: .
    image: deepy-skill-market:latest
    restart: unless-stopped
    environment:
      SKILL_MARKET_DATA_DIR: /data
      SKILL_MARKET_ADMIN_TOKEN: ${SKILL_MARKET_ADMIN_TOKEN:-change-me}
    ports:
      - "8000:8000"
    volumes:
      - skill_market_data:/data

volumes:
  skill_market_data:
