[project]
name = "deepy-skill-market"
version = "0.1.0"
description = "Minimal Deepy skill market service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "PyYAML>=6.0.2,<7",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
